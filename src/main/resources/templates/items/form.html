<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>データ入力フォーム</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 mb-5">
<h2 th:text="${item.id == null} ? '新規登録' : 'データ編集'">フォーム</h2>

<form th:action="${item.id == null} ? @{/items/new} : @{/items/{id}/edit(id=${item.id})}" th:object="${item}" method="post" class="mt-3" style="max-width: 600px;">

    <div class="mb-3">
        <label for="title" class="form-label">タイトル</label>
        <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" id="title">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">エラーメッセージ</div>
    </div>

    <div class="mb-3">
        <label for="borrowerName" class="form-label">貸出先名</label>
        <input type="text" th:field="*{borrowerName}" class="form-control" th:errorclass="is-invalid" id="borrowerName">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('borrowerName')}" th:errors="*{borrowerName}">エラーメッセージ</div>
    </div>

    <div class="mb-3">
        <label for="rentalDate" class="form-label">貸出日</label>
        <input type="text" th:field="*{rentalDate}" class="form-control" th:errorclass="is-invalid" id="rentalDate">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('rentalDate')}" th:errors="*{rentalDate}">エラーメッセージ</div>
    </div>

    <div class="mb-3">
        <label for="returnDueDate" class="form-label">返却期限日</label>
        <input type="text" th:field="*{returnDueDate}" class="form-control" th:errorclass="is-invalid" id="returnDueDate">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('returnDueDate')}" th:errors="*{returnDueDate}">エラーメッセージ</div>
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">'貸出中' / '返却済'</label>
        <select id="status" th:field="*{status}" class="form-select">
            <option value="">-- 選択してください --</option>

            <option th:each="status : ${statusMap}"
                    th:value="${status.key}"
                    th:text="${status.value}">
            </option>
        </select>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success" th:text="${item.id == null} ? '登録する' : '更新する'">保存</button>
        <a th:href="@{/items}" class="btn btn-secondary">キャンセル</a>
    </div>
</form>
</body>
</html>
