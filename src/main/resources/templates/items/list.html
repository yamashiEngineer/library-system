<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理一覧画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>管理データ一覧</h2>
    <div>
        <a th:href="@{/items/new}" class="btn btn-primary">新規登録</a>
        <a th:href="@{/items/summary}" class="btn btn-success">集計データ確認</a>
    </div>
</div>
<div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}">ここにエラーメッセージが表示されます</span>
</div>

<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>タイトル</th>
        <th>貸出先名</th>
        <th>貸出日</th>
        <th>返却期限日</th>
        <th>貸出状態</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}" th:classappend="${item.overdue} ? 'table-danger' : ''">
        <td th:text="${item.id}"></td>
        <td th:text="${item.title}"></td>
        <td th:text="${item.borrowerName}"></td>
        <td th:text="${item.rentalDate}"></td>
        <td th:text="${item.returnDueDate}"></td>
        <td th:text="${item.status}"></td>
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/items/{id}/edit(id=${item.id})}" class="btn btn-sm btn-warning">編集</a>
                <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('本当に削除しますか？');">
                    <button type="submit" class="btn btn-sm btn-danger">削除</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
